<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>注文状況確認 - Miyajima Fan Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'M PLUS Rounded 1c',sans-serif; background:linear-gradient(135deg,#f0f7ff,#eaf6ff); margin:0; padding:16px; color:#333; }
    .wrap { max-width:640px; margin:0 auto; }
    h1 { text-align:center; font-size:22px; color:#1565c0; margin:20px 0; }
    .card { background:#fff; border-radius:20px; padding:18px; margin-bottom:16px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    #langButtons { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    #langButtons button { flex:1; padding:8px; font-size:14px; border:1px solid #ddd; background:#fdfdfd; color:#333; border-radius:10px; box-shadow:none; }
    label { display:block; font-weight:700; margin-bottom:8px; color:#1565c0; }
    input, button { width:100%; box-sizing:border-box; font-size:18px; padding:12px; border-radius:14px; border:1px solid #ccc; margin:8px 0; }
    button.primary { background:#2196f3; color:#fff; border:none; border-radius:24px; font-weight:700; box-shadow:0 4px 8px rgba(0,0,0,.18); }
    #statusBox { text-align:center; font-size:17px; line-height:1.7; }
    .status-title { font-size:26px; font-weight:700; margin-bottom:10px; }
    .number { display:inline-block; font-size:34px; font-weight:700; color:#1565c0; background:#e3f2fd; padding:8px 22px; border-radius:18px; margin:10px 0 16px; }
    .sub { color:#666; font-size:14px; margin-top:10px; }
    .error { color:#c62828; font-weight:700; }
    .ready { background:#e8f5e9; color:#1b5e20; border-radius:18px; padding:16px; }
    .wait { background:#fffde7; color:#5d4a00; border-radius:18px; padding:16px; }
    .printing { background:#e3f2fd; color:#0d47a1; border-radius:18px; padding:16px; }
    .picked { background:#f3e5f5; color:#4a148c; border-radius:18px; padding:16px; }
    .order-image-wrap { margin:15px 0; }
    .order-image {
      max-width:100%;
      border-radius:12px;
      border:1px solid #ccc;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
      background:#fff;
    }
    .copies-box {
      display:inline-block;
      margin:10px 0 14px;
      padding:8px 16px;
      border-radius:14px;
      background:rgba(255,255,255,.75);
      font-weight:700;
      font-size:18px;
    }
    footer { text-align:center; font-size:11px; color:#888; margin-top:24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="langButtons">
      <button onclick="setLanguage('ja')">🇯🇵JP</button>
      <button onclick="setLanguage('en')">🇺🇸EN</button>
      <button onclick="setLanguage('zh')">🇨🇳中文</button>
      <button onclick="setLanguage('ko')">🇰🇷KO</button>
      <button onclick="setLanguage('vi')">🇻🇳VI</button>
    </div>

    <h1 id="pageTitle">注文状況確認</h1>

    <div class="card">
      <label id="numberLabel" for="numberInput">受付番号を入力してください</label>
      <input id="numberInput" inputmode="numeric" pattern="[0-9]*" placeholder="例：3" />
      <button id="checkBtn" class="primary">状況を確認する</button>
      <div id="hint" class="sub">受付番号は、注文完了画面に表示された数字です。</div>
    </div>

    <div class="card">
      <div id="statusBox">
        <div class="sub">受付番号を入力して、状況を確認してください。</div>
      </div>
    </div>

    <footer>Miyajima Fan Studio</footer>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
    authDomain: "my-uchiwa-queue.firebaseapp.com",
    projectId: "my-uchiwa-queue",
    storageBucket: "my-uchiwa-queue.firebasestorage.app",
    messagingSenderId: "245883628081",
    appId: "1:245883628081:web:ab7f00f01ba256ebca8310",
    measurementId: "G-W4S3EKL9TY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentLang = "ja";
  let unsubscribe = null;
  let currentDisplayNo = null;

  const texts = {
    ja: {
      title: "注文状況確認", label: "受付番号を入力してください", button: "状況を確認する",
      hint: "受付番号は、注文完了画面に表示された数字です。", placeholder: "例：3",
      initial: "受付番号を入力して、状況を確認してください。", checking: "確認中です…",
      invalid: "受付番号を数字で入力してください。", notFound: "注文が見つかりませんでした。受付番号をご確認ください。",
      receptionNo: "受付番号",
      statusWaitTitle: "⏳ 受付済み", statusWaitBody: "宮島観光をお楽しみください。<br>うちわが完成したら、このページで確認できます。",
      statusPrintingTitle: "🖨 作成中", statusPrintingBody: "ただいまうちわを作成しています。<br>宮島観光をお楽しみください。",
      statusReadyTitle: "✅ 受け取り可能", statusReadyBody: "うちわの準備ができました。<br>店舗へお越しください。",
      statusPickedTitle: "🎉 受け渡し済み", statusPickedBody: "ご利用ありがとうございました。",
      statusClosedTitle: "受付終了", statusClosedBody: "この注文は受付終了になっています。", unknown: "現在の状況を確認できません。",
      copiesLabel: "注文本数",
      totalLabel: "合計金額",
      priceTypeLabel: "料金区分"
    },
    en: {
      title: "Check Order Status", label: "Enter your reception number", button: "Check Status",
      hint: "Your reception number is the number shown after placing your order.", placeholder: "Example: 3",
      initial: "Enter your reception number to check the status.", checking: "Checking…",
      invalid: "Please enter your reception number using numbers only.", notFound: "Order not found. Please check your reception number.",
      receptionNo: "Reception No.",
      statusWaitTitle: "⏳ Received", statusWaitBody: "Please enjoy sightseeing in Miyajima.<br>You can check this page when your fan is ready.",
      statusPrintingTitle: "🖨 In Production", statusPrintingBody: "We are making your fan now.<br>Please enjoy sightseeing in Miyajima.",
      statusReadyTitle: "✅ Ready for Pickup", statusReadyBody: "Your fan is ready.<br>Please come to the shop.",
      statusPickedTitle: "🎉 Picked Up", statusPickedBody: "Thank you for your order.",
      statusClosedTitle: "Closed", statusClosedBody: "This order has been closed.", unknown: "Unable to check the current status.",
      copiesLabel: "Quantity",
      totalLabel: "Total",
      priceTypeLabel: "Price Type"
    },
    zh: {
      title: "订单状态确认", label: "请输入受理编号", button: "查看状态",
      hint: "受理编号是下单完成画面中显示的数字。", placeholder: "例：3",
      initial: "请输入受理编号以查看状态。", checking: "正在确认…",
      invalid: "请用数字输入受理编号。", notFound: "未找到订单。请确认受理编号。",
      receptionNo: "受理编号",
      statusWaitTitle: "⏳ 已受理", statusWaitBody: "请尽情享受宫岛观光。<br>团扇完成后，可在此页面确认。",
      statusPrintingTitle: "🖨 制作中", statusPrintingBody: "我们正在制作您的团扇。<br>请尽情享受宫岛观光。",
      statusReadyTitle: "✅ 可以领取", statusReadyBody: "您的团扇已经准备好了。<br>请前往店铺领取。",
      statusPickedTitle: "🎉 已领取", statusPickedBody: "感谢您的使用。",
      statusClosedTitle: "已结束", statusClosedBody: "此订单已结束。", unknown: "无法确认当前状态。",
      copiesLabel: "订购数量",
      totalLabel: "总计",
      priceTypeLabel: "价格类型"
    },
    ko: {
      title: "주문 상태 확인", label: "접수번호를 입력해 주세요", button: "상태 확인",
      hint: "접수번호는 주문 완료 화면에 표시된 숫자입니다.", placeholder: "예: 3",
      initial: "접수번호를 입력하여 상태를 확인해 주세요.", checking: "확인 중입니다…",
      invalid: "접수번호는 숫자로 입력해 주세요.", notFound: "주문을 찾을 수 없습니다. 접수번호를 확인해 주세요.",
      receptionNo: "접수번호",
      statusWaitTitle: "⏳ 접수 완료", statusWaitBody: "미야지마 관광을 즐겨 주세요.<br>부채가 완성되면 이 페이지에서 확인할 수 있습니다.",
      statusPrintingTitle: "🖨 제작 중", statusPrintingBody: "현재 부채를 제작하고 있습니다.<br>미야지마 관광을 즐겨 주세요.",
      statusReadyTitle: "✅ 수령 가능", statusReadyBody: "부채가 준비되었습니다.<br>매장으로 와 주세요.",
      statusPickedTitle: "🎉 수령 완료", statusPickedBody: "이용해 주셔서 감사합니다.",
      statusClosedTitle: "접수 종료", statusClosedBody: "이 주문은 종료되었습니다.", unknown: "현재 상태를 확인할 수 없습니다.",
      copiesLabel: "주문 수량",
      totalLabel: "합계",
      priceTypeLabel: "요금 구분"
    },
    vi: {
      title: "Kiểm tra trạng thái đơn hàng", label: "Nhập mã số tiếp nhận", button: "Kiểm tra trạng thái",
      hint: "Mã số tiếp nhận là số hiển thị sau khi đặt hàng.", placeholder: "Ví dụ: 3",
      initial: "Nhập mã số tiếp nhận để kiểm tra trạng thái.", checking: "Đang kiểm tra…",
      invalid: "Vui lòng nhập mã số bằng số.", notFound: "Không tìm thấy đơn hàng. Vui lòng kiểm tra mã số.",
      receptionNo: "Mã số",
      statusWaitTitle: "⏳ Đã tiếp nhận", statusWaitBody: "Hãy tận hưởng chuyến tham quan Miyajima.<br>Khi quạt hoàn thành, bạn có thể kiểm tra tại trang này.",
      statusPrintingTitle: "🖨 Đang làm", statusPrintingBody: "Chúng tôi đang làm quạt của bạn.<br>Hãy tận hưởng chuyến tham quan Miyajima.",
      statusReadyTitle: "✅ Có thể nhận", statusReadyBody: "Quạt của bạn đã sẵn sàng.<br>Vui lòng đến cửa hàng.",
      statusPickedTitle: "🎉 Đã nhận", statusPickedBody: "Cảm ơn bạn đã sử dụng dịch vụ.",
      statusClosedTitle: "Đã kết thúc", statusClosedBody: "Đơn hàng này đã kết thúc.", unknown: "Không thể kiểm tra trạng thái hiện tại.",
      copiesLabel: "Số lượng",
      totalLabel: "Tổng cộng",
      priceTypeLabel: "Loại giá"
    }
  };

  function t(key) { return (texts[currentLang] && texts[currentLang][key]) || texts.ja[key] || ""; }

  function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.getElementById("pageTitle").textContent = t("title");
    document.getElementById("numberLabel").textContent = t("label");
    document.getElementById("checkBtn").textContent = t("button");
    document.getElementById("hint").textContent = t("hint");
    document.getElementById("numberInput").placeholder = t("placeholder");
    if (currentDisplayNo) startWatch(currentDisplayNo);
    else document.getElementById("statusBox").innerHTML = `<div class="sub">${t("initial")}</div>`;
  }
  window.setLanguage = setLanguage;

  function getTodayKey() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    return `${yy}${mm}${dd}`;
  }

  function normalizeNumber(value) {
    const raw = String(value || "").trim();
    const onlyNumber = raw.replace(/[^\d]/g, "");
    if (!onlyNumber) return null;
    return Number(onlyNumber);
  }

  function showNotFound(displayNo) {
    document.getElementById("statusBox").innerHTML = `<div class="error">${t("notFound")}</div><div class="number">${displayNo || ""}</div>`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getPriceTypeText(priceType) {

    if (priceType === "student") {
      if (currentLang === "en") return "Student (¥500/fan)";
      if (currentLang === "zh") return "学生优惠（500日元/把）";
      if (currentLang === "ko") return "학생 할인 (500엔/개)";
      if (currentLang === "vi") return "Ưu đãi học sinh (500 yên/chiếc)";
      return "学割（500円／本）";
    }

    if (currentLang === "en") return "General (¥800/fan)";
    if (currentLang === "zh") return "普通价格（800日元/把）";
    if (currentLang === "ko") return "일반 (800엔/개)";
    if (currentLang === "vi") return "Thông thường (800 yên/chiếc)";
    return "一般（800円／本）";
  }

  function showStatus(data) {
    const displayNo = data.displayNo || normalizeNumber(data.shortId) || currentDisplayNo || "";
    const status = String(data.status || "WAIT").toUpperCase();
    const imageUrl = data.imageUrl || "";
    const copies = data.copies || 1;
    const totalPrice = data.totalPrice || 0;
    const priceType = data.priceType || "general";

    const imageHtml = imageUrl
      ? `
        <div class="order-image-wrap">
          <img class="order-image" src="${escapeHtml(imageUrl)}" alt="注文画像">
        </div>
      `
      : "";

    const copiesHtml = `
      <div class="copies-box">
        ${t("copiesLabel")}：${escapeHtml(copies)}
      </div>
    `;

    const totalPriceHtml = totalPrice
      ? `
        <div class="copies-box">
          ${t("totalLabel")}：${totalPrice.toLocaleString()}円
        </div>
      `
      : "";

    const priceTypeHtml = `
      <div class="copies-box">
        ${t("priceTypeLabel")}：${escapeHtml(getPriceTypeText(priceType))}
      </div>
    `;

    let title = "", body = "", cls = "";
    if (status === "WAIT") { title = t("statusWaitTitle"); body = t("statusWaitBody"); cls = "wait"; }
    else if (status === "PRINTING") { title = t("statusPrintingTitle"); body = t("statusPrintingBody"); cls = "printing"; }
    else if (status === "READY") { title = t("statusReadyTitle"); body = t("statusReadyBody"); cls = "ready"; }
    else if (status === "PICKED_UP") { title = t("statusPickedTitle"); body = t("statusPickedBody"); cls = "picked"; }
    else if (status === "CLOSED") { title = t("statusClosedTitle"); body = t("statusClosedBody"); cls = "picked"; }
    else { title = status; body = t("unknown"); cls = ""; }

    document.getElementById("statusBox").innerHTML = `
      <div class="${cls}">
        <div class="status-title">${title}</div>
        <div>${t("receptionNo")}</div>
        <div class="number">${escapeHtml(displayNo)}</div>

        ${imageHtml}

        ${priceTypeHtml}

        ${copiesHtml}

        ${totalPriceHtml}

        <div>${body}</div>
      </div>`;
  }

  function startWatch(displayNo) {
    const normalized = normalizeNumber(displayNo);
    if (!normalized) {
      document.getElementById("statusBox").innerHTML = `<div class="error">${t("invalid")}</div>`;
      return;
    }
    currentDisplayNo = normalized;
    document.getElementById("numberInput").value = normalized;
    document.getElementById("statusBox").innerHTML = `<div class="sub">${t("checking")}</div>`;
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }

    const dayKey = getTodayKey();
    const q = query(
      collection(db, "orders"),
      where("dayKey", "==", dayKey),
      where("displayNo", "==", normalized),
      limit(1)
    );
    unsubscribe = onSnapshot(q, (snapshot) => {
      if (snapshot.empty) { showNotFound(normalized); return; }
      showStatus(snapshot.docs[0].data());
    }, (error) => {
      console.error(error);
      document.getElementById("statusBox").innerHTML = `<div class="error">${t("unknown")}</div>`;
    });
  }

  document.getElementById("checkBtn").addEventListener("click", () => startWatch(document.getElementById("numberInput").value));
  document.getElementById("numberInput").addEventListener("keydown", (e) => { if (e.key === "Enter") startWatch(document.getElementById("numberInput").value); });

  window.addEventListener("load", () => {
    const userLang = navigator.language || navigator.userLanguage;
    if (userLang.startsWith("en")) currentLang = "en";
    else if (userLang.startsWith("zh")) currentLang = "zh";
    else if (userLang.startsWith("ko")) currentLang = "ko";
    else if (userLang.startsWith("vi")) currentLang = "vi";
    else currentLang = "ja";
    setLanguage(currentLang);
    const params = new URLSearchParams(window.location.search);
    const idFromUrl = params.get("id");
    if (idFromUrl) startWatch(idFromUrl);
  });
</script>
</body>
</html>
