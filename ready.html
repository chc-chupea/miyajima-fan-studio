<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>受け渡し・問い合わせ専用画面 - Miyajima Fan Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family:'M PLUS Rounded 1c',sans-serif; background:#f3f7fb; margin:0; padding:14px; color:#333; }
    .wrap { max-width:760px; margin:0 auto; }
    h1 { text-align:center; color:#1b5e20; font-size:24px; margin:12px 0 16px; }
    h2 { color:#1565c0; font-size:18px; margin:4px 0 12px; }
    .top-card, .order-card, .empty, .section-card { background:#fff; border-radius:18px; padding:14px; margin-bottom:14px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
    .summary { background:#e8f5e9; color:#1b5e20; border-radius:14px; padding:12px; text-align:center; font-weight:900; font-size:20px; }
    .small { font-size:12px; color:#666; margin-top:8px; text-align:center; line-height:1.5; }
    .search-row { margin-top:12px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
    .search-row input { width:100%; box-sizing:border-box; font-size:18px; padding:12px; border-radius:12px; border:1px solid #ccc; }
    button { border:none; border-radius:20px; padding:12px 16px; font-weight:700; cursor:pointer; background:#2196f3; color:#fff; font-size:16px; }
    .btn-search { background:#2196f3; white-space:nowrap; }
    .search-status { margin-top:8px; font-size:14px; color:#1b5e20; font-weight:700; text-align:center; }
    #searchResults, #orders { display:grid; grid-template-columns:1fr; gap:12px; }
    .order-card { border-left:8px solid #4caf50; }
    .order-card.WAIT { border-left-color:#fbc02d; }
    .order-card.PRINTING { border-left-color:#2196f3; }
    .order-card.READY { border-left-color:#4caf50; }
    .order-card.PICKED_UP { border-left-color:#9c27b0; }
    .order-card.CLOSED { border-left-color:#777; }
    .order-main { display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:start; }
    .thumb { width:150px; max-height:120px; object-fit:contain; border-radius:10px; border:1px solid #ddd; background:#fff; }
    .no-image { width:150px; height:100px; display:flex; align-items:center; justify-content:center; background:#eee; color:#777; border-radius:10px; font-size:12px; }
    .label { font-size:14px; color:#555; font-weight:700; }
    .display-code-large { font-size:42px; font-weight:900; color:#0d47a1; background:#e3f2fd; display:inline-block; padding:8px 18px; border-radius:16px; letter-spacing:1px; margin:4px 0 10px; }
    .status-badge { display:inline-block; padding:5px 12px; border-radius:999px; font-weight:900; font-size:14px; margin-bottom:8px; }
    .badge-WAIT { background:#fff9c4; color:#5d4a00; }
    .badge-PRINTING { background:#e3f2fd; color:#0d47a1; }
    .badge-READY { background:#e8f5e9; color:#1b5e20; }
    .badge-PICKED_UP { background:#f3e5f5; color:#4a148c; }
    .badge-CLOSED { background:#eee; color:#555; }
    .status-message { margin:8px 0 10px; padding:10px; border-radius:12px; font-size:15px; font-weight:700; line-height:1.5; background:#f5f5f5; color:#333; }
    .status-message.WAIT { background:#fffde7; color:#5d4a00; }
    .status-message.PRINTING { background:#e3f2fd; color:#0d47a1; }
    .status-message.READY { background:#e8f5e9; color:#1b5e20; }
    .status-message.PICKED_UP { background:#f3e5f5; color:#4a148c; }
    .status-message.CLOSED { background:#eee; color:#555; }
    .info { font-size:16px; line-height:1.8; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .btn-picked { background:#9c27b0; font-size:18px; padding:14px 18px; }
    .empty { text-align:center; color:#777; padding:34px; font-size:18px; }
    .section-note { font-size:13px; color:#666; line-height:1.5; margin-bottom:10px; }
    @media (max-width:640px) {
      .order-main { grid-template-columns:1fr; }
      .thumb, .no-image { width:100%; max-height:220px; }
      .display-code-large { font-size:40px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>受け渡し・問い合わせ専用画面</h1>

    <div class="top-card">
      <div id="summaryCount" class="summary">READY：0件 / 0本</div>
      <div class="search-row">
        <input id="searchCodeInput" inputmode="text" autocapitalize="characters" placeholder="受付番号を入力（例：M060410）">
        <button id="searchBtn" class="btn-search">検索</button>
      </div>
      <div id="searchStatus" class="search-status">受付番号を入力して「検索」を押してください。</div>
      <div class="small">
        下のREADY一覧は常に表示したまま、検索結果だけを上に表示します。<br>
        現在の会場ID：<strong id="currentShopIdText">miyajima</strong>
      </div>
    </div>

    <div class="section-card">
      <h2>検索結果</h2>
      <div class="section-note">お客さまから受付番号を聞いたときはここで全ステータスを確認できます。</div>
      <div id="searchResults">
        <div class="empty">受付番号を入力して「検索」を押してください。</div>
      </div>
    </div>

    <div class="section-card">
      <h2>完成品一覧</h2>
      <div class="section-note">READYになった注文だけを常時表示します。受け渡しが終わったら「受渡済にする」を押してください。</div>
      <div id="orders">
        <div class="empty">読み込み中です…</div>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
    authDomain: "my-uchiwa-queue.firebaseapp.com",
    projectId: "my-uchiwa-queue",
    storageBucket: "my-uchiwa-queue.firebasestorage.app",
    messagingSenderId: "245883628081",
    appId: "1:245883628081:web:ab7f00f01ba256ebca8310",
    measurementId: "G-W4S3EKL9TY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let orders = [];
  let searchCode = "";

  const params = new URLSearchParams(window.location.search);
  const shopId = (params.get("shop") || "miyajima").replace(/[^a-zA-Z0-9_-]/g, "");
  document.getElementById("currentShopIdText").textContent = shopId;

  function getTodayKey() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    return `${yy}${mm}${dd}`;
  }

  function yen(value) {
    return `${Number(value || 0).toLocaleString()}円`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function priceTypeText(priceType) {
    return priceType === "student" ? "学割" : "一般";
  }

  function statusText(status) {
    const s = String(status || "WAIT").toUpperCase();
    if (s === "WAIT") return "受付済み";
    if (s === "PRINTING") return "作成中";
    if (s === "READY") return "完成";
    if (s === "PICKED_UP") return "受渡済";
    if (s === "CLOSED") return "終了";
    return s;
  }

  function statusMessage(status) {
    const s = String(status || "WAIT").toUpperCase();
    if (s === "WAIT") return "まだ受付済みです。印刷作業には入っていません。";
    if (s === "PRINTING") return "現在作成中です。完成までもうしばらくお待ちください。";
    if (s === "READY") return "完成しています。受け渡しできます。";
    if (s === "PICKED_UP") return "受渡済になっています。渡し間違い・押し間違いがないか確認してください。";
    if (s === "CLOSED") return "終了扱いです。管理担当者へ確認してください。";
    return "現在の状況を確認してください。";
  }

  function getDisplayCode(data) {
    if (data.displayCode) return String(data.displayCode);

    const dayKey = String(data.dayKey || "");
    const displayNo = data.displayNo || Number(data.shortId || 0) || "";
    if (dayKey.length >= 6 && displayNo) {
      const code = data.shopCode || "";
      return `${code}${dayKey.slice(2)}${Number(displayNo)}`;
    }

    return displayNo ? String(displayNo) : "";
  }

  async function markPickedUp(queueId) {
    if (!queueId) return;

    if (!confirm("この注文を受渡済にしますか？")) return;

    try {
      const orderRef = doc(db, "orders", queueId);
      await updateDoc(orderRef, {
        status: "PICKED_UP",
        updatedAt: serverTimestamp(),
        pickedUpAt: serverTimestamp()
      });
    } catch (error) {
      console.error(error);
      alert("受渡済への更新に失敗しました。通信状態を確認してください。");
    }
  }

  function renderSummary(list) {
    const totalCount = list.length;
    const totalCopies = list.reduce((sum, item) => sum + Number(item.data.copies || 1), 0);
    document.getElementById("summaryCount").textContent = `READY：${totalCount}件 / ${totalCopies}本`;
  }

  function createOrderCard(item, options = {}) {
    const data = item.data;
    const status = String(data.status || "WAIT").toUpperCase();
    const displayNo = data.displayNo || Number(data.shortId || 0) || "";
    const displayCode = getDisplayCode(data);
    const imageUrl = data.imageUrl || "";
    const copies = Number(data.copies || 1);
    const totalPrice = Number(data.totalPrice || 0);
    const queueId = data.queueId || item.id || "";
    const createdAt = data.createdAt?.toDate
      ? data.createdAt.toDate().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
      : "";

    const imageHtml = imageUrl
      ? `<a href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener">
           <img class="thumb" src="${escapeHtml(imageUrl)}" alt="注文画像">
         </a>`
      : `<div class="no-image">画像なし</div>`;

    const actionHtml = status === "READY"
      ? `<div class="actions"><button class="btn-picked" data-id="${escapeHtml(queueId)}">受渡済にする</button></div>`
      : "";

    const messageHtml = options.showStatusMessage
      ? `<div class="status-message ${status}">${escapeHtml(statusMessage(status))}</div>`
      : "";

    return `
      <div class="order-card ${status}">
        <div class="order-main">
          <div>${imageHtml}</div>

          <div>
            <div class="label">受付番号</div>
            <div class="display-code-large">${escapeHtml(displayCode)}</div>
            <div class="status-badge badge-${status}">${statusText(status)}</div>
            ${messageHtml}

            <div class="info">
              <div><strong>短番：</strong>${escapeHtml(displayNo)}</div>
              <div><strong>料金区分：</strong>${priceTypeText(data.priceType)}</div>
              <div><strong>注文本数：</strong>${escapeHtml(copies)}本</div>
              <div><strong>合計金額：</strong>${yen(totalPrice)}</div>
              <div><strong>受付時刻：</strong>${escapeHtml(createdAt)}</div>
            </div>

            ${actionHtml}
          </div>
        </div>
      </div>
    `;
  }

  function bindPickedButtons(root = document) {
    root.querySelectorAll(".btn-picked").forEach(btn => {
      btn.addEventListener("click", () => markPickedUp(btn.dataset.id));
    });
  }

  function renderReadyList() {
    const readyOrders = orders.filter(item => String(item.data.status || "").toUpperCase() === "READY");
    renderSummary(readyOrders);

    const box = document.getElementById("orders");

    if (readyOrders.length === 0) {
      box.innerHTML = `<div class="empty">完成待ちの商品はありません。</div>`;
      return;
    }

    box.innerHTML = readyOrders.map(item => createOrderCard(item)).join("");
    bindPickedButtons(box);
  }

  function renderSearchResults() {
    const box = document.getElementById("searchResults");
    const searchStatusEl = document.getElementById("searchStatus");

    if (!searchCode) {
      searchStatusEl.textContent = "受付番号を入力して「検索」を押してください。";
      box.innerHTML = `<div class="empty">受付番号を入力して「検索」を押してください。</div>`;
      return;
    }

    const matchedOrders = orders.filter(item =>
      getDisplayCode(item.data).toUpperCase().includes(searchCode)
    );

    searchStatusEl.textContent = `検索中の受付番号：${searchCode} ／ 該当：${matchedOrders.length}件`;

    if (matchedOrders.length === 0) {
      box.innerHTML = `<div class="empty">該当する受付番号はありません。番号の打ち間違いを確認してください。</div>`;
      return;
    }

    box.innerHTML = matchedOrders.map(item => createOrderCard(item, { showStatusMessage: true })).join("");
    bindPickedButtons(box);
  }

  function renderAll() {
    renderSearchResults();
    renderReadyList();
  }

  function startWatch() {
    const dayKey = getTodayKey();

    const q = query(
      collection(db, "orders"),
      where("dayKey", "==", dayKey),
      where("shopId", "==", shopId)
    );

    onSnapshot(q, snapshot => {
      orders = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        data: docSnap.data()
      }));

      orders.sort((a, b) => {
        const aTime = a.data.updatedAt?.toMillis
          ? a.data.updatedAt.toMillis()
          : (a.data.createdAt?.toMillis ? a.data.createdAt.toMillis() : 0);
        const bTime = b.data.updatedAt?.toMillis
          ? b.data.updatedAt.toMillis()
          : (b.data.createdAt?.toMillis ? b.data.createdAt.toMillis() : 0);
        return aTime - bTime;
      });

      renderAll();
    }, error => {
      console.error(error);
      document.getElementById("orders").innerHTML =
        `<div class="empty">READY一覧の読み込みに失敗しました。</div>`;
    });
  }

  function normalizeSearchInput() {
    const input = document.getElementById("searchCodeInput");
    const value = String(input.value || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");
    input.value = value;
    return value;
  }

  function runSearch() {
    searchCode = normalizeSearchInput();
    renderSearchResults();
  }

  document.getElementById("searchCodeInput").addEventListener("input", normalizeSearchInput);

  document.getElementById("searchCodeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      runSearch();
    }
  });

  document.getElementById("searchBtn").addEventListener("click", runSearch);

  startWatch();
</script>
</body>
</html>
