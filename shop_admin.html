<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通販管理画面 - Myうちわ Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#1976d2;
      --blue-dark:#0d47a1;
      --orange:#f57c00;
      --green:#2e7d32;
      --red:#c62828;
      --purple:#6a1b9a;
      --gray:#607d8b;
      --bg:#f5f8fc;
      --card:#fff;
      --line:#dbe7f3;
      --text:#243447;
      --muted:#66788a;
      --radius:18px;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'M PLUS Rounded 1c',sans-serif;background:var(--bg);color:var(--text);padding:14px;}
    button,input,textarea{font-family:inherit;}
    .wrap{max-width:1120px;margin:0 auto;}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px;}
    h1{margin:0;color:var(--blue-dark);font-size:22px;line-height:1.25;}
    .shop-badge{display:inline-block;background:#e8f5e9;color:#1b5e20;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900;margin-left:6px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(13,71,161,.06);}
    .nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .nav a,.btn{border:none;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;padding:10px 14px;font-weight:900;cursor:pointer;display:inline-block;}
    .btn.gray{background:var(--gray);} .btn.orange{background:var(--orange);} .btn.green{background:var(--green);} .btn.red{background:var(--red);} .btn.purple{background:var(--purple);} 
    .btn.outline{background:#fff;color:var(--blue-dark);border:1px solid #90caf9;}
    .btn.outline.active{background:var(--blue-dark);color:#fff;}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .summary div{background:#e3f2fd;color:var(--blue-dark);border-radius:14px;padding:12px;text-align:center;font-weight:900;line-height:1.45;}
    .summary small{display:block;color:var(--muted);font-size:12px;font-weight:700;}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
    .search-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;}
    .search-row input{width:100%;border:1px solid #cbd9e8;border-radius:14px;padding:12px;font-size:16px;}
    .small{font-size:12px;color:var(--muted);line-height:1.6;}
    .empty{padding:28px;text-align:center;color:var(--muted);font-weight:700;background:#fff;border:1px dashed #b7c7d8;border-radius:16px;}
    .order-card{background:#fff;border:1px solid var(--line);border-left:8px solid #fbc02d;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
    .order-card.PRODUCING{border-left-color:var(--blue);} .order-card.SHIPPED{border-left-color:var(--green);} .order-card.CANCELLED{border-left-color:var(--red);} 
    .order-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;}
    .code{font-size:30px;font-weight:900;color:var(--blue-dark);background:#e3f2fd;border-radius:16px;padding:6px 14px;letter-spacing:1px;display:inline-block;}
    .badge{display:inline-block;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900;margin:4px 0;}
    .badge.WAIT{background:#fff8e1;color:#795548;} .badge.PRODUCING{background:#e3f2fd;color:#0d47a1;} .badge.SHIPPED{background:#e8f5e9;color:#1b5e20;} .badge.CANCELLED{background:#ffebee;color:#b71c1c;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
    .info{font-size:15px;line-height:1.75;}
    .info strong{color:var(--blue-dark);}
    .money{background:#fff3e0;color:#e65100;border-radius:14px;padding:12px;font-weight:900;line-height:1.7;}
    .items{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
    .item{display:grid;grid-template-columns:110px 1fr;gap:10px;background:#f8fbff;border:1px solid #d7e7f6;border-radius:14px;padding:10px;align-items:start;}
    .thumb{width:110px;max-height:82px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;}
    .item-title{font-weight:900;color:var(--blue-dark);}
    .item-meta{font-size:13px;color:var(--muted);font-weight:700;line-height:1.6;}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
    .memo-area{margin-top:10px;display:none;}
    .memo-area textarea{width:100%;min-height:80px;border:1px solid #cbd9e8;border-radius:12px;padding:10px;font-size:14px;}
    .search-result-area{display:none;background:#ffcdd2;border:3px solid #c62828;border-radius:18px;padding:12px;margin-bottom:14px;}
    .search-result-area.active{display:block;}
    .search-result-title{background:#c62828;color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;margin-bottom:10px;}
    .pin-lock{max-width:430px;margin:70px auto;background:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.10);}
    .pin-lock input{width:100%;padding:14px;border:1px solid #ccc;border-radius:14px;font-size:26px;text-align:center;letter-spacing:8px;margin:12px 0;}
    .pin-error{min-height:1.5em;color:var(--red);font-weight:900;}
    .hidden{display:none;}
    #labelPrintArea{display:none;}
    .label-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;align-items:center;justify-content:center;padding:14px;}
    .label-modal.active{display:flex;}
    .label-modal .inner{max-width:760px;width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:16px;}
    .label-preview{border:2px solid #333;border-radius:12px;padding:14px;color:#000;background:#fff;line-height:1.6;}
    .label-preview .lp-code{font-size:24px;font-weight:900;}
    .label-preview .lp-name{font-size:20px;font-weight:900;}
    @media print{
      body *{visibility:hidden!important;}
      #labelPrintArea,#labelPrintArea *{visibility:visible!important;}
      #labelPrintArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:10mm;background:#fff;color:#000;}
      .print-label{border:1px solid #333;border-radius:4mm;padding:6mm;margin-bottom:6mm;break-inside:avoid;page-break-inside:avoid;font-family:Arial,'Yu Gothic',sans-serif;}
      .print-code{font-size:16pt;font-weight:900;margin-bottom:2mm;}
      .print-name{font-size:18pt;font-weight:900;margin-bottom:2mm;}
      .print-line{font-size:11pt;margin-bottom:1mm;}
      .print-address{font-size:13pt;line-height:1.5;white-space:pre-wrap;margin-top:2mm;}
    }
    @media(max-width:760px){
      body{padding:10px;}
      .summary{grid-template-columns:1fr 1fr;}
      .grid{grid-template-columns:1fr;}
      .item{grid-template-columns:84px 1fr;}
      .thumb{width:84px;max-height:64px;}
      .code{font-size:26px;}
      .search-row{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div id="pinLock" class="pin-lock">
    <h1>通販管理画面PIN</h1>
    <div class="small">4桁のPINを入力してください。</div>
    <input id="adminPinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button id="adminPinBtn" class="btn">開く</button>
    <div id="pinError" class="pin-error"></div>
  </div>

  <div id="adminMain" class="wrap hidden">
    <div class="topbar">
      <h1>通販管理画面 <span id="shopBadge" class="shop-badge">shop</span></h1>
      <div class="nav">
        <a id="shopLink" href="shop.html?shop=ippin" target="_blank" rel="noopener">注文ページ</a>
        <a id="settingsLink" href="settings.html?shop=ippin" target="_blank" rel="noopener">設定</a>
      </div>
    </div>

    <div class="card">
      <div class="summary">
        <div id="summaryOrders">注文 0件<small>表示対象</small></div>
        <div id="summaryCopies">0本<small>本数合計</small></div>
        <div id="summaryProduct">0円<small>商品代</small></div>
        <div id="summaryTotal">0円<small>代引合計</small></div>
      </div>
      <div class="toolbar">
        <button class="btn outline active" data-filter="ALL">すべて</button>
        <button class="btn outline" data-filter="WAIT">受付済</button>
        <button class="btn outline" data-filter="PRODUCING">制作中</button>
        <button class="btn outline" data-filter="SHIPPED">発送済</button>
        <button class="btn outline" data-filter="CANCELLED">キャンセル</button>
        <button id="csvExportBtn" class="btn orange">CSV出力</button>
      </div>
      <div class="search-row">
        <input id="searchInput" inputmode="text" autocapitalize="characters" placeholder="受付番号・氏名・電話番号で検索（例：I0616-0001 / 山田 / 090）">
        <button id="searchBtn" class="btn">検索</button>
      </div>
      <div class="small">対象：shop.html から入った通販注文（orderType=cart_cod / source=shop-cart-cod）。</div>
    </div>

    <div id="searchResults" class="search-result-area"></div>

    <div class="card">
      <h2 style="margin:0 0 10px;color:var(--blue-dark);font-size:18px;">注文一覧</h2>
      <div id="orders"><div class="empty">読み込み中です…</div></div>
    </div>
  </div>

  <div id="labelModal" class="label-modal">
    <div class="inner">
      <h2 style="margin:0 0 10px;color:var(--blue-dark);">発送ラベル確認</h2>
      <div id="labelPreview" class="label-preview"></div>
      <div class="actions">
        <button id="printLabelBtn" class="btn orange">印刷する</button>
        <button id="closeLabelBtn" class="btn gray">閉じる</button>
      </div>
    </div>
  </div>
  <div id="labelPrintArea"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
    authDomain: "my-uchiwa-queue.firebaseapp.com",
    projectId: "my-uchiwa-queue",
    storageBucket: "my-uchiwa-queue.firebasestorage.app",
    messagingSenderId: "245883628081",
    appId: "1:245883628081:web:ab7f00f01ba256ebca8310",
    measurementId: "G-W4S3EKL9TY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const shopId = (params.get("shop") || "ippin").replace(/[^a-zA-Z0-9_-]/g, "");
  const settingsRef = doc(db,"settings",shopId);
  const defaultSettings = { shopCode:"S", adminPin:"2468", cartFixedFee:1000, generalPrice:880, shopName:"Myうちわ Shop" };

  let settings = {...defaultSettings};
  let orders = [];
  let currentFilter = "ALL";
  let searchText = "";
  let currentLabelOrder = null;

  const els = {
    pinLock:document.getElementById("pinLock"),
    adminMain:document.getElementById("adminMain"),
    pinInput:document.getElementById("adminPinInput"),
    pinError:document.getElementById("pinError"),
    orders:document.getElementById("orders"),
    searchResults:document.getElementById("searchResults"),
    searchInput:document.getElementById("searchInput"),
    labelModal:document.getElementById("labelModal"),
    labelPreview:document.getElementById("labelPreview"),
    labelPrintArea:document.getElementById("labelPrintArea")
  };

  document.getElementById("shopBadge").textContent = shopId;
  document.getElementById("shopLink").href = `shop.html?shop=${encodeURIComponent(shopId)}&v=${Date.now()}`;
  document.getElementById("settingsLink").href = `settings.html?shop=${encodeURIComponent(shopId)}`;

  function yen(v){ return `${Number(v||0).toLocaleString()}円`; }
  function escapeHtml(value){ return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;"); }
  function nl2br(value){ return escapeHtml(value).replace(/\n/g,"<br>"); }
  function statusText(s){ return ({WAIT:"受付済",PRODUCING:"制作中",SHIPPED:"発送済",CANCELLED:"キャンセル"})[s] || s || "受付済"; }
  function statusClass(s){ return ["WAIT","PRODUCING","SHIPPED","CANCELLED"].includes(s) ? s : "WAIT"; }
  function getDisplayCode(d){ return d.displayCode || (d.displayNo ? `${String(settings.shopCode||"S").toUpperCase()}-${d.displayNo}` : d.queueId) || ""; }
  function formatDate(v){ try{ if(v?.toDate) return v.toDate().toLocaleString("ja-JP"); }catch(e){} return ""; }
  function getFixedFee(d){ return Number(d.cartFixedFee ?? d.shippingFee ?? settings.cartFixedFee ?? 1000); }
  function getItems(d){ return Array.isArray(d.cartItems) ? d.cartItems : []; }
  function getCopies(d){ return Number(d.copies || getItems(d).reduce((s,i)=>s+Number(i.copies||0),0)); }
  function getProductTotal(d){ return Number(d.productTotal || getItems(d).reduce((s,i)=>s+Number(i.productTotal||0),0)); }
  function getTotal(d){ return Number(d.totalPrice || (getProductTotal(d)+getFixedFee(d))); }
  function isShopOrder(d){ return d?.orderType === "cart_cod" || d?.source === "shop-cart-cod"; }

  async function loadSettings(){
    try{
      const snap = await getDoc(settingsRef);
      settings = snap.exists() ? {...defaultSettings,...snap.data()} : {...defaultSettings};
    }catch(e){ console.error(e); settings = {...defaultSettings}; }
  }

  function getAdminPin(){ return String(settings.adminPin || defaultSettings.adminPin).replace(/[^0-9]/g,"").slice(0,4); }
  function showMain(){ els.pinLock.style.display="none"; els.adminMain.classList.remove("hidden"); }
  function checkPin(){
    const v = String(els.pinInput.value||"").replace(/[^0-9]/g,"").slice(0,4);
    els.pinInput.value = v;
    if(v === getAdminPin()){
      sessionStorage.setItem(`shopAdminPinOk_${shopId}`,"1");
      showMain();
      startWatch();
    }else{
      els.pinError.textContent = "PINが違います。";
      els.pinInput.value = "";
      els.pinInput.focus();
    }
  }
  function setupPin(){
    els.pinInput.addEventListener("input", e=>{ e.target.value = String(e.target.value||"").replace(/[^0-9]/g,"").slice(0,4); });
    els.pinInput.addEventListener("keydown", e=>{ if(e.key==="Enter") checkPin(); });
    document.getElementById("adminPinBtn").addEventListener("click", checkPin);
    if(sessionStorage.getItem(`shopAdminPinOk_${shopId}`)==="1"){
      showMain();
      startWatch();
    }else{
      els.pinInput.focus();
    }
  }

  function startWatch(){
    const q = query(collection(db,"orders"), where("shopId","==",shopId));
    onSnapshot(q, snap=>{
      orders = [];
      snap.forEach(ds=>{
        const data = ds.data() || {};
        if(isShopOrder(data)) orders.push({id:ds.id,data});
      });
      orders.sort((a,b)=>Number(b.data.displayNo||0)-Number(a.data.displayNo||0));
      renderAll();
    }, err=>{
      console.error(err);
      els.orders.innerHTML = `<div class="empty">注文の読み込みに失敗しました。</div>`;
    });
  }

  function filteredOrders(){
    let list = orders;
    if(currentFilter !== "ALL") list = list.filter(o => (o.data.status || "WAIT") === currentFilter);
    if(searchText){
      const q = searchText.toLowerCase();
      list = list.filter(o=>{
        const d=o.data;
        return [getDisplayCode(d), d.customerName, d.customerPhone, d.normalizedPhone, d.customerAddress, d.queueId]
          .some(v=>String(v||"").toLowerCase().includes(q));
      });
    }
    return list;
  }

  function renderAll(){
    renderSummary();
    renderOrders();
  }

  function renderSummary(){
    const list = filteredOrders();
    const copies = list.reduce((s,o)=>s+getCopies(o.data),0);
    const product = list.reduce((s,o)=>s+getProductTotal(o.data),0);
    const total = list.reduce((s,o)=>s+getTotal(o.data),0);
    document.getElementById("summaryOrders").innerHTML = `注文 ${list.length}件<small>表示対象</small>`;
    document.getElementById("summaryCopies").innerHTML = `${copies.toLocaleString()}本<small>本数合計</small>`;
    document.getElementById("summaryProduct").innerHTML = `${yen(product)}<small>商品代</small>`;
    document.getElementById("summaryTotal").innerHTML = `${yen(total)}<small>代引合計</small>`;
  }

  function renderOrders(){
    const list = filteredOrders();
    if(!list.length){ els.orders.innerHTML = `<div class="empty">該当する注文はありません。</div>`; return; }
    els.orders.innerHTML = list.map(renderOrderCard).join("");
    bindOrderButtons();
  }

  function renderOrderCard(item){
    const d = item.data;
    const st = statusClass(d.status || "WAIT");
    const items = getItems(d);
    const itemHtml = items.length ? items.map((ci,idx)=>`
      <div class="item">
        ${ci.imageUrl ? `<a href="${escapeHtml(ci.imageUrl)}" target="_blank" rel="noopener"><img class="thumb" src="${escapeHtml(ci.imageUrl)}" alt=""></a>` : `<div class="thumb"></div>`}
        <div>
          <div class="item-title">${idx+1}. ${escapeHtml(ci.templateName || ci.templateFile || "デザイン")}</div>
          <div class="item-meta">${Number(ci.copies||0)}本 / 単価 ${yen(ci.unitPrice)} / 小計 ${yen(ci.productTotal)}</div>
          ${ci.imageUrl ? `<div class="item-meta"><a href="${escapeHtml(ci.imageUrl)}" target="_blank" rel="noopener">画像を開く</a></div>` : ""}
        </div>
      </div>
    `).join("") : `<div class="empty">カート内訳がありません。</div>`;

    return `
      <div class="order-card ${st}" data-id="${escapeHtml(item.id)}">
        <div class="order-head">
          <div>
            <div class="code">${escapeHtml(getDisplayCode(d))}</div>
            <div><span class="badge ${st}">${statusText(st)}</span></div>
            <div class="small">注文日時：${escapeHtml(formatDate(d.createdAt))} / ID：${escapeHtml(item.id)}</div>
          </div>
          <div class="money">
            <div>商品代：${yen(getProductTotal(d))}</div>
            <div>送料・代引手数料：${yen(getFixedFee(d))}</div>
            <div style="font-size:20px;">代引合計：${yen(getTotal(d))}</div>
          </div>
        </div>
        <div class="grid">
          <div class="info">
            <div><strong>氏名：</strong>${escapeHtml(d.customerName || "")}</div>
            <div><strong>電話：</strong>${escapeHtml(d.customerPhone || "")}</div>
            <div><strong>住所：</strong><br>${nl2br(d.customerAddress || "")}</div>
            ${d.customerMemo ? `<div><strong>メモ：</strong><br>${nl2br(d.customerMemo)}</div>` : ""}
          </div>
          <div class="info">
            <div><strong>商品数：</strong>${Number(d.itemCount || items.length || 0)}デザイン</div>
            <div><strong>本数：</strong>${getCopies(d)}本</div>
            <div><strong>支払方法：</strong>${escapeHtml(d.paymentMethod || "代金引換")}</div>
            <div><strong>支払タイミング：</strong>${escapeHtml(d.paymentTiming || "商品到着時に配送業者へお支払い")}</div>
          </div>
        </div>
        <div class="items">${itemHtml}</div>
        <div class="actions">
          <button class="btn" data-action="status" data-status="WAIT" data-id="${escapeHtml(item.id)}">受付済</button>
          <button class="btn purple" data-action="status" data-status="PRODUCING" data-id="${escapeHtml(item.id)}">制作中</button>
          <button class="btn green" data-action="status" data-status="SHIPPED" data-id="${escapeHtml(item.id)}">発送済</button>
          <button class="btn red" data-action="status" data-status="CANCELLED" data-id="${escapeHtml(item.id)}">キャンセル</button>
          <button class="btn orange" data-action="label" data-id="${escapeHtml(item.id)}">発送ラベル</button>
          <button class="btn gray" data-action="memo" data-id="${escapeHtml(item.id)}">管理メモ</button>
        </div>
        <div class="memo-area" id="memo_${escapeHtml(item.id)}">
          <textarea>${escapeHtml(d.adminMemo || "")}</textarea>
          <button class="btn" data-action="saveMemo" data-id="${escapeHtml(item.id)}">メモ保存</button>
        </div>
      </div>
    `;
  }

  function bindOrderButtons(){
    document.querySelectorAll("[data-action='status']").forEach(btn=>{
      btn.addEventListener("click", async()=>{
        const id = btn.dataset.id;
        const status = btn.dataset.status;
        await updateDoc(doc(db,"orders",id), { status, updatedAt:serverTimestamp(), ...(status==="SHIPPED" ? { shippedAt:serverTimestamp() } : {}) });
      });
    });
    document.querySelectorAll("[data-action='label']").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const item = orders.find(o=>o.id===btn.dataset.id);
        if(item) openLabel(item);
      });
    });
    document.querySelectorAll("[data-action='memo']").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const box = document.getElementById(`memo_${btn.dataset.id}`);
        if(box) box.style.display = box.style.display === "block" ? "none" : "block";
      });
    });
    document.querySelectorAll("[data-action='saveMemo']").forEach(btn=>{
      btn.addEventListener("click", async()=>{
        const box = document.getElementById(`memo_${btn.dataset.id}`);
        const memo = box?.querySelector("textarea")?.value || "";
        await updateDoc(doc(db,"orders",btn.dataset.id), { adminMemo:memo, updatedAt:serverTimestamp() });
        alert("メモを保存しました。");
      });
    });
  }

  function openLabel(item){
    currentLabelOrder = item;
    const d = item.data;
    const html = `
      <div class="lp-code">受付番号：${escapeHtml(getDisplayCode(d))}</div>
      <div class="lp-name">${escapeHtml(d.customerName || "")} 様</div>
      <div>電話：${escapeHtml(d.customerPhone || "")}</div>
      <div>住所：</div>
      <div style="font-size:18px;white-space:pre-wrap;">${escapeHtml(d.customerAddress || "")}</div>
      <hr>
      <div>品名：オリジナルうちわ</div>
      <div>本数：${getCopies(d)}本 / ${Number(d.itemCount || getItems(d).length || 0)}デザイン</div>
      <div>代引合計：${yen(getTotal(d))}</div>
      <div>発送元：中国新聞販売センター</div>
    `;
    els.labelPreview.innerHTML = html;
    els.labelModal.classList.add("active");
  }

  function printCurrentLabel(){
    if(!currentLabelOrder) return;
    const d = currentLabelOrder.data;
    els.labelPrintArea.innerHTML = `
      <div class="print-label">
        <div class="print-code">受付番号：${escapeHtml(getDisplayCode(d))}</div>
        <div class="print-name">${escapeHtml(d.customerName || "")} 様</div>
        <div class="print-line">電話：${escapeHtml(d.customerPhone || "")}</div>
        <div class="print-address">${escapeHtml(d.customerAddress || "")}</div>
        <hr>
        <div class="print-line">品名：オリジナルうちわ</div>
        <div class="print-line">本数：${getCopies(d)}本 / ${Number(d.itemCount || getItems(d).length || 0)}デザイン</div>
        <div class="print-line">代引合計：${yen(getTotal(d))}</div>
        <div class="print-line">発送元：中国新聞販売センター</div>
      </div>
    `;
    window.print();
  }

  function csvEscape(v){ const s=String(v??""); return `"${s.replace(/"/g,'""')}"`; }
  function exportCsv(){
    const list = filteredOrders();
    if(!list.length){ alert("出力できる注文がありません。"); return; }
    const headers = ["受付番号","注文日時","ステータス","氏名","電話番号","住所","メモ","デザイン数","本数","商品代","送料代引手数料","代引合計","支払方法","カート内訳","画像URL"];
    const rows = list.map(o=>{
      const d=o.data;
      const items = getItems(d);
      const detail = items.map(i=>`${i.templateName || i.templateFile || "デザイン"} ${i.copies || 0}本 ${yen(i.productTotal)}`).join(" / ");
      const urls = items.map(i=>i.imageUrl||"").filter(Boolean).join(" ");
      return [getDisplayCode(d), formatDate(d.createdAt), statusText(statusClass(d.status||"WAIT")), d.customerName||"", d.customerPhone||"", d.customerAddress||"", d.customerMemo||"", d.itemCount||items.length, getCopies(d), getProductTotal(d), getFixedFee(d), getTotal(d), d.paymentMethod||"代金引換", detail, urls];
    });
    const csv = [headers.map(csvEscape).join(","), ...rows.map(r=>r.map(csvEscape).join(","))].join("\r\n");
    const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ymd = new Date().toISOString().slice(0,10).replace(/-/g,"");
    a.href=url; a.download=`${shopId}_shop_orders_${ymd}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  document.querySelectorAll(".btn.outline[data-filter]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentFilter = btn.dataset.filter;
      document.querySelectorAll(".btn.outline[data-filter]").forEach(b=>b.classList.toggle("active", b===btn));
      renderAll();
    });
  });
  document.getElementById("searchBtn").addEventListener("click",()=>{ searchText = els.searchInput.value.trim(); renderAll(); });
  els.searchInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ searchText = els.searchInput.value.trim(); renderAll(); } });
  document.getElementById("csvExportBtn").addEventListener("click", exportCsv);
  document.getElementById("closeLabelBtn").addEventListener("click",()=>els.labelModal.classList.remove("active"));
  document.getElementById("printLabelBtn").addEventListener("click", printCurrentLabel);

  await loadSettings();
  setupPin();
</script>
</body>
</html>
