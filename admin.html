<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>作業画面 - Miyajima Fan Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'M PLUS Rounded 1c',sans-serif; background:#f3f7fb; margin:0; padding:14px; color:#333; }
    .wrap { max-width:960px; margin:0 auto; }
    h1 { text-align:center; color:#1565c0; font-size:22px; margin:12px 0 18px; }
    .top-card, .order-card, .empty, .nav-card { background:#fff; border-radius:18px; padding:14px; margin-bottom:14px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
    .summary { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; font-size:15px; font-weight:700; }
    .summary div { background:#e3f2fd; color:#0d47a1; border-radius:12px; padding:10px; text-align:center; }
    .toolbar, .nav-links { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    button, .nav-links a { border:none; border-radius:20px; padding:10px 14px; font-weight:700; cursor:pointer; background:#2196f3; color:#fff; text-decoration:none; display:inline-block; }
    .filter-btn { background:#fff; color:#1565c0; border:1px solid #90caf9; }
    .filter-btn.active { background:#1565c0; color:#fff; }
    #orders { display:grid; grid-template-columns:1fr; gap:12px; }
    .order-card { border-left:8px solid #ccc; }
    .order-card.WAIT { border-left-color:#fbc02d; }
    .order-card.PRINTING { border-left-color:#2196f3; }
    .order-card.READY { border-left-color:#4caf50; }
    .order-card.PICKED_UP { border-left-color:#9c27b0; }
    .order-card.CLOSED { border-left-color:#777; }
    .order-main { display:grid; grid-template-columns:130px 1fr; gap:12px; align-items:start; }
    .thumb { width:130px; max-height:100px; object-fit:contain; border-radius:10px; border:1px solid #ddd; background:#fff; }
    .no-image { width:130px; height:90px; display:flex; align-items:center; justify-content:center; background:#eee; color:#777; border-radius:10px; font-size:12px; }
    .order-number { font-size:28px; font-weight:700; color:#1565c0; margin-bottom:4px; }
    .status-badge { display:inline-block; padding:4px 10px; border-radius:999px; font-weight:700; font-size:13px; margin-bottom:8px; }
    .badge-WAIT { background:#fff9c4; color:#5d4a00; }
    .badge-PRINTING { background:#e3f2fd; color:#0d47a1; }
    .badge-READY { background:#e8f5e9; color:#1b5e20; }
    .badge-PICKED_UP { background:#f3e5f5; color:#4a148c; }
    .badge-CLOSED { background:#eee; color:#555; }
    .info { font-size:15px; line-height:1.7; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn-printing { background:#2196f3; }
    .btn-ready { background:#4caf50; }
    .btn-picked { background:#9c27b0; }
    .btn-wait { background:#f9a825; color:#333; }
    .btn-close { background:#777; }
    .btn-download { background:#00a86b; }
    .btn-label-single { background:#795548; }
    .ecommerce-alert { background:#fff8e1; color:#e65100; font-weight:900; border-radius:10px; padding:8px 10px; margin:6px 0; }
    .shipping-group-detail {
      background:#fff8e1;
      border:2px solid #ffb74d;
      color:#bf360c;
      border-radius:12px;
      padding:10px;
      margin:8px 0;
      font-weight:700;
      line-height:1.7;
    }
    .shipping-group-detail .group-total {
      font-size:17px;
      color:#d84315;
      font-weight:900;
    }

    .view-btn { background:#fff; color:#6d4c41; border:1px solid #bcaaa4; }
    .view-btn.active { background:#6d4c41; color:#fff; }
    .shipping-group-card {
      background:#fff;
      border-left:10px solid #ff9800;
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.08);
    }
    .shipping-group-header {
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      background:#fff8e1;
      border:2px solid #ffcc80;
      border-radius:14px;
      padding:12px;
      color:#bf360c;
      font-weight:800;
      line-height:1.7;
    }
    .shipping-group-title {
      font-size:21px;
      font-weight:900;
      color:#e65100;
    }
    .shipping-group-totals {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin-top:8px;
    }
    .shipping-group-totals div {
      background:#fff;
      border-radius:12px;
      padding:9px;
      color:#d84315;
      font-weight:900;
      text-align:center;
    }
    .shipping-group-orders { margin-top:12px; }
    .shipping-group-order-row {
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px;
      padding:10px;
      margin-top:8px;
      border-radius:12px;
      border:1px solid #eee;
      background:#fafafa;
      align-items:start;
    }
    .shipping-group-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .btn-label-group { background:#795548; }
    @media (max-width:640px) {
      .shipping-group-totals { grid-template-columns:1fr; }
      .shipping-group-order-row { grid-template-columns:1fr; }
    }
    .empty { text-align:center; color:#777; padding:30px; }
    .small { font-size:12px; color:#777; margin-top:4px; }
    .shop-badge { display:inline-block; background:#e8f5e9; color:#1b5e20; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:700; margin-left:6px; }
    .display-code-large { font-size:34px; font-weight:900; color:#0d47a1; background:#e3f2fd; display:inline-block; padding:8px 18px; border-radius:16px; letter-spacing:1px; margin:4px 0 8px; }
    .internal-id { font-size:12px; color:#666; word-break:break-all; margin-bottom:6px; }
    .search-row { margin-top:12px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
    .search-row input { width:100%; box-sizing:border-box; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid #ccc; }
    .btn-search { background:#1565c0; color:white; white-space:nowrap; }
    .section-title { font-size:18px; font-weight:900; margin:18px 0 10px; color:#1565c0; }
    .search-result-area { display:none; background:#ffcdd2; border:3px solid #c62828; border-radius:18px; padding:14px; margin-bottom:16px; box-shadow:0 3px 10px rgba(0,0,0,.12); }
    .search-result-area.active { display:block; }
    .search-result-title { background:#c62828; color:#fff; border-radius:12px; padding:10px 12px; font-size:18px; font-weight:900; margin-bottom:12px; }
    .search-result-area .order-card { background:#ffebee; border-left:12px solid #c62828; margin-bottom:0; }
    .list-area { margin-top:6px; }

    @keyframes readyPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(76,175,80,0); }
    }
    .search-ready-badge {
      display:inline-block;
      background:#4caf50;
      color:#fff;
      font-weight:900;
      padding:8px 16px;
      border-radius:999px;
      margin-bottom:10px;
      animation:readyPulse 1s infinite;
    }

    .pin-lock-card {
      max-width:420px;
      margin:60px auto;
      background:#fff;
      border-radius:20px;
      padding:22px;
      box-shadow:0 4px 14px rgba(0,0,0,.12);
      text-align:center;
    }
    .pin-lock-card h1 {
      margin:0 0 12px;
      color:#1565c0;
    }
    .pin-lock-card input {
      width:100%;
      box-sizing:border-box;
      padding:14px;
      font-size:24px;
      letter-spacing:8px;
      text-align:center;
      border-radius:14px;
      border:1px solid #ccc;
      margin:12px 0;
    }
    .pin-error {
      color:#c62828;
      font-weight:700;
      margin-top:10px;
      min-height:1.5em;
    }
    .hidden-until-auth {
      display:none;
    }


    .label-print-sheet { display:none; }

    @media print {
      body * { visibility:hidden !important; }
      #labelPrintArea, #labelPrintArea * { visibility:visible !important; }
      #labelPrintArea {
        display:grid !important;
        position:absolute;
        left:0;
        top:0;
        width:100%;
        grid-template-columns:repeat(2, 1fr);
        gap:8mm;
        padding:10mm;
        box-sizing:border-box;
        background:#fff;
      }
      .print-label-card {
        break-inside:avoid;
        page-break-inside:avoid;
        border:1px solid #333;
        border-radius:4mm;
        padding:6mm;
        min-height:45mm;
        box-sizing:border-box;
        font-family:Arial, "Yu Gothic", sans-serif;
        color:#000;
        background:#fff;
      }
      .print-label-code {
        font-size:12pt;
        font-weight:700;
        margin-bottom:2mm;
      }
      .print-label-name {
        font-size:18pt;
        font-weight:700;
        margin-bottom:2mm;
      }
      .print-label-kana,
      .print-label-phone,
      .print-label-subscription {
        font-size:10pt;
        margin-bottom:1mm;
      }
      .print-label-address {
        font-size:12pt;
        line-height:1.5;
        margin-top:2mm;
        white-space:pre-wrap;
      }
    }

    @media (max-width:640px) {
      .order-main { grid-template-columns:1fr; }
      .thumb, .no-image { width:100%; max-height:180px; }
      .summary { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div id="pinLock" class="pin-lock-card">
    <h1>管理画面PIN</h1>
    <div class="small">4桁のPINを入力してください。</div>
    <input id="adminPinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
    <button id="adminPinBtn">開く</button>
    <div id="pinError" class="pin-error"></div>
  </div>

  <div class="wrap hidden-until-auth" id="adminMain">
    <h1>店員用 作業画面 <span id="shopBadge" class="shop-badge">miyajima</span></h1>

    <div class="nav-card">
      <strong>作業用画面です。</strong>
      <div class="small">会場設定・価格変更・受付終了モードは settings.html で操作してください。</div>
      <div class="nav-links">
        <a id="settingsLink" href="settings.html?shop=miyajima">設定画面</a>
        <a id="readyLink" href="ready_inquiry.html?shop=miyajima">受け渡し・問い合わせ画面</a>
        <a id="orderLink" href="index.html?shop=miyajima" target="_blank" rel="noopener">注文画面</a>
      </div>
    </div>

    <div class="top-card">
      <div class="summary">
        <div id="summaryCount">全期間受付：0件</div>
        <div id="summarySales">売上合計：0円</div>
        <div id="summaryGeneral">一般：0件 / 0円</div>
        <div id="summaryStudent">学割：0件 / 0円</div>
      </div>

      <div class="toolbar">
        <button class="filter-btn active" data-filter="ALL">すべて</button>
        <button class="filter-btn" data-filter="WAIT">受付済み</button>
        <button class="filter-btn" data-filter="PRINTING">作成中</button>
        <button class="filter-btn" data-filter="READY">完成</button>
        <button class="filter-btn" data-filter="PICKED_UP">受渡済</button>
        <button id="csvExportBtn" style="background:#ff9800;">CSV出力</button>
        <button id="labelPrintBtn" style="background:#795548;">ラベル印刷</button>
        <button class="view-btn active" data-view="GROUP">発送グループ表示</button>
        <button class="view-btn" data-view="ORDER">注文単位表示</button>
      </div>

      <div class="search-row">
        <input id="searchCodeInput" inputmode="text" autocapitalize="characters" placeholder="受付番号で検索（例：M060410）">
        <button id="searchBtn" class="btn-search">検索</button>
      </div>

      <div class="small">※番号を入力して「検索」を押すと、上部に赤色の検索結果を表示します。下の通常一覧はそのまま残ります。</div>
    </div>

    <div id="searchResults" class="search-result-area"></div>

    <div class="list-area">
      <div class="section-title">通常一覧</div>
      <div id="orders"><div class="empty">読み込み中です…</div></div>
    </div>

    <div id="labelPrintArea" class="label-print-sheet"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
    authDomain: "my-uchiwa-queue.firebaseapp.com",
    projectId: "my-uchiwa-queue",
    storageBucket: "my-uchiwa-queue.firebasestorage.app",
    messagingSenderId: "245883628081",
    appId: "1:245883628081:web:ab7f00f01ba256ebca8310",
    measurementId: "G-W4S3EKL9TY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let orders = [];
  let currentFilter = "ALL";
  let currentView = "GROUP";
  let searchCode = "";
  let popupSettings = null;

  const params = new URLSearchParams(window.location.search);
  const shopId = (params.get("shop") || "miyajima").replace(/[^a-zA-Z0-9_-]/g, "");
  const settingsRef = doc(db, "settings", shopId);

  document.getElementById("shopBadge").textContent = shopId;
  document.getElementById("settingsLink").href = `settings.html?shop=${encodeURIComponent(shopId)}`;
  document.getElementById("readyLink").href = `ready_inquiry.html?shop=${encodeURIComponent(shopId)}`;
  document.getElementById("orderLink").href = `index.html?shop=${encodeURIComponent(shopId)}`;

  const defaultSettings = { generalPrice: 800, studentPrice: 500, shopCode: "M", adminPin: "2468" };

  async function loadSettings() {
    try {
      const snap = await getDoc(settingsRef);
      popupSettings = snap.exists() ? { ...defaultSettings, ...snap.data() } : { ...defaultSettings };
    } catch (error) {
      console.error(error);
      popupSettings = { ...defaultSettings };
    }
  }

  function getAdminPin() {
    return String(popupSettings?.adminPin || defaultSettings.adminPin || "2468")
      .replace(/[^0-9]/g, "")
      .slice(0, 4);
  }

  function showAdminMain() {
    document.getElementById("pinLock").style.display = "none";
    document.getElementById("adminMain").classList.remove("hidden-until-auth");
  }

  function checkAdminPin() {
    const input = document.getElementById("adminPinInput");
    const error = document.getElementById("pinError");
    const value = String(input.value || "").replace(/[^0-9]/g, "").slice(0, 4);
    input.value = value;

    if (value === getAdminPin()) {
      sessionStorage.setItem(`adminPinOk_${shopId}`, "1");
      showAdminMain();
      startWatch();
    } else {
      error.textContent = "PINが違います。";
      input.value = "";
      input.focus();
    }
  }

  function setupPinGate() {
    const input = document.getElementById("adminPinInput");
    const button = document.getElementById("adminPinBtn");

    input.addEventListener("input", (e) => {
      e.target.value = String(e.target.value || "").replace(/[^0-9]/g, "").slice(0, 4);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkAdminPin();
    });

    button.addEventListener("click", checkAdminPin);

    if (sessionStorage.getItem(`adminPinOk_${shopId}`) === "1") {
      showAdminMain();
      startWatch();
    } else {
      input.focus();
    }
  }

  function getTodayKey() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    return `${yy}${mm}${dd}`;
  }

  function yen(value) { return `${Number(value || 0).toLocaleString()}円`; }
  function escapeHtml(value) {
    return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;");
  }
  function operationModeText(value) {
    if (value === "delivery") return "後日訪問";
    if (value === "ecommerce") return "通販";
    if (value === "instant") return "即時受取";
    return value || "";
  }

  function isCartCodOrder(data) {
    return data?.source === "fan-site-cart-cod-order" || data?.paymentMethod === "代金引換" || data?.priceType === "cod_cart";
  }

  function renderCartItems(data) {
    if (!Array.isArray(data?.items) || data.items.length === 0) return "";
    return `
      <div class="shipping-group-detail">
        <div class="group-total">カート内訳：${escapeHtml(data.items.length)}デザイン</div>
        ${data.items.map((item, index) => `
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid #ffcc80;">
            <strong>${index + 1}. ${escapeHtml(item.templateName || templateText(item.template))}</strong><br>
            ${escapeHtml(item.copies || 1)}本 ／ ${yen(item.productTotal || 0)}
            ${item.imageUrl ? `<br><a href="${escapeHtml(item.imageUrl)}" target="_blank" rel="noopener">画像を開く</a>` : ""}
          </div>
        `).join("")}
      </div>
    `;
  }

  function getShippingUnits(copies) {
    return Math.max(0, Math.ceil(Number(copies || 0) / 10));
  }

  function getShippingFeeByCopies(copies) {
    return getShippingUnits(copies) * 430;
  }

  function getShippingGroupKey(data) {
    if (!data) return "";
    if (isCartCodOrder(data)) return `cart_${data.queueId || data.displayCode || data.shortId || Math.random()}`;
    if (data.shippingGroupId) return String(data.shippingGroupId);
    if (data.dayKey && data.normalizedPhone) return `${shopId}_${data.dayKey}_${data.normalizedPhone}`;
    return "";
  }

  function buildShippingGroupStats(list) {
    const map = new Map();

    list.forEach(item => {
      const data = item.data || {};
      if (!isEcommerceOrder(data)) return;

      const key = getShippingGroupKey(data);
      if (!key) return;

      if (!map.has(key)) {
        map.set(key, {
          key,
          orderCount: 0,
          copies: 0,
          productTotal: 0,
          shippingUnits: 0,
          shippingFee: 0,
          paymentTotal: 0
        });
      }

      const stat = map.get(key);
      const copies = Number(data.copies || 1);
      const unitPrice = Number(data.unitPrice || popupSettings?.generalPrice || 800);
      const productTotal = Number(data.productTotal || (unitPrice * copies));

      stat.orderCount += 1;
      stat.copies += copies;
      stat.productTotal += productTotal;
    });

    map.forEach(stat => {
      const firstOrder = list.find(item => getShippingGroupKey(item.data || {}) === stat.key)?.data || {};
      if (isCartCodOrder(firstOrder)) {
        stat.shippingUnits = 1;
        stat.shippingFee = Number(firstOrder.shippingFee || firstOrder.fixedShippingAndCodFee || 1000);
      } else {
        stat.shippingUnits = getShippingUnits(stat.copies);
        stat.shippingFee = getShippingFeeByCopies(stat.copies);
      }
      stat.paymentTotal = stat.productTotal + stat.shippingFee;
    });

    return map;
  }

  let shippingGroupStats = new Map();

  function getShippingGroupStats(data) {
    const key = getShippingGroupKey(data);
    if (key && shippingGroupStats.has(key)) return shippingGroupStats.get(key);

    const copies = Number(data?.shippingGroupTotalCopies || data?.copies || 1);
    const productTotal = Number(data?.shippingGroupProductTotal || data?.productTotal || (Number(data?.unitPrice || popupSettings?.generalPrice || 800) * copies));
    const shippingFee = isCartCodOrder(data) ? Number(data?.shippingFee || data?.fixedShippingAndCodFee || 1000) : Number(data?.shippingGroupShippingFee || getShippingFeeByCopies(copies));
    return {
      key,
      orderCount: key ? 1 : 0,
      copies,
      productTotal,
      shippingUnits: getShippingUnits(copies),
      shippingFee,
      paymentTotal: Number(data?.shippingGroupPaymentTotal || (productTotal + shippingFee))
    };
  }

  function isEcommerceOrder(data) {
    return data?.operationMode === "ecommerce" || data?.source === "ecommerce-fan-studio" || data?.source === "fan-site-mail-order";
  }

  function shippingGroupSummary(data) {
    if (!isEcommerceOrder(data)) return "";
    const groupId = data.shippingGroupId || getShippingGroupKey(data);
    const stat = getShippingGroupStats(data);
    if (isCartCodOrder(data)) {
      return `
        <div class="ecommerce-alert">通販発送：カート注文／代金引換</div>
        <div class="shipping-group-detail">
          <div class="group-total">合計：${escapeHtml(stat.copies)}本 ／ ${escapeHtml(data.cartItemCount || data.items?.length || 1)}デザイン</div>
          <div><strong>商品代：</strong>${yen(stat.productTotal)}</div>
          <div><strong>送料・代引手数料：</strong>${yen(stat.shippingFee)}</div>
          <div><strong>お支払い合計：</strong>${yen(stat.paymentTotal)}</div>
          <div><strong>支払い方法：</strong>代金引換（商品到着時支払い）</div>
        </div>
        ${renderCartItems(data)}
      `;
    }
    return `
      <div class="ecommerce-alert">通販発送：同日＋正規化電話番号で自動同梱</div>
      <div class="shipping-group-detail">
        ${groupId ? `<div><strong>発送グループID：</strong>${escapeHtml(groupId)}</div>` : ""}
        ${data.normalizedPhone ? `<div><strong>正規化電話番号：</strong>${escapeHtml(data.normalizedPhone)}</div>` : ""}
        <div><strong>この登録の商品代：</strong>${yen(Number(data.productTotal || 0))}</div>
        <div class="group-total">現在の同梱予定合計：${escapeHtml(stat.copies)}本</div>
        <div><strong>送料目安：</strong>${yen(stat.shippingFee)}（レターパックライト${escapeHtml(stat.shippingUnits)}通分／10本ごとに430円）</div>
        <div><strong>同梱グループ商品代：</strong>${yen(stat.productTotal)}</div>
        <div><strong>お支払い目安：</strong>${yen(stat.paymentTotal)}（商品到着後／請求書同封）</div>

  function formatSubscriptionStatus(value) {
    if (Array.isArray(value)) return value.join(" / ");
    return String(value || "");
  }

  function formatCreatedAtForCsv(value) {
    if (value?.toDate) {
      return value.toDate().toLocaleString("ja-JP");
    }
    return "";
  }

  function csvEscape(value) {
    const str = String(value ?? "");
    return `"${str.replace(/"/g, '""')}"`;
  }

  function exportOrdersCsv() {
    if (!orders || orders.length === 0) {
      alert("出力できる注文データがありません。");
      return;
    }

    const headers = [
      "受付番号",
      "注文日時",
      "運用モード",
      "氏名",
      "ふりがな",
      "電話番号",
      "正規化電話番号",
      "発送グループID",
      "送料",
      "同梱後本数目安",
      "同梱後送料目安",
      "住所",
      "メモ",
      "購読状況",
      "本数",
      "料金",
      "ステータス",
      "画像URL",
      "カート内訳"
    ];

    const rows = orders.map(item => {
      const data = item.data || {};
      const stat = isEcommerceOrder(data) ? getShippingGroupStats(data) : null;
      return [
        getDisplayCode(data),
        formatCreatedAtForCsv(data.createdAt),
        operationModeText(data.operationMode),
        data.customerName || "",
        data.customerKana || "",
        data.customerPhone || "",
        data.normalizedPhone || "",
        data.shippingGroupId || "",
        data.shippingFee || "",
        stat ? stat.copies : (data.shippingGroupTotalCopies || ""),
        stat ? stat.shippingFee : (data.shippingGroupShippingFee || ""),
        data.customerAddress || "",

        data.customerMemo || "",

        formatSubscriptionStatus(data.subscriptionStatus),
        data.copies || 1,
        getTotalPrice(data),
        statusText(data.status),
        data.imageUrl || "",
        Array.isArray(data.items) ? data.items.map(item => `${item.templateName || item.template || ""}:${item.copies || 1}本`).join(" / ") : ""
      ];
    });

    const csv = [
      headers.map(csvEscape).join(","),
      ...rows.map(row => row.map(csvEscape).join(","))
    ].join("\r\n");

    const bom = "\ufeff";
    const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const now = new Date();
    const ymd = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
    const a = document.createElement("a");
    a.href = url;
    a.download = `${shopId}_orders_${ymd}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function statusText(status) {
    const s = String(status || "WAIT").toUpperCase();
    if (s === "WAIT") return "受付済み";
    if (s === "PRINTING") return "作成中";
    if (s === "READY") return "完成";
    if (s === "PICKED_UP") return "受渡済";
    if (s === "CLOSED") return "終了";
    return s;
  }
  function priceTypeText(priceType, data = {}) {
    if (isEcommerceOrder(data)) return "通販・後払い";
    if (data.salesMode === "free") return "無料";
    if (data.salesMode === "firstFree") return "1本目無料";
    if (data.salesMode === "paidGeneralOnly") return "一般のみ";
    return priceType === "student" ? "学割" : "一般";
  }
  function getUnitPrice(data) {
    if (data.unitPrice) return Number(data.unitPrice);
    const generalPrice = Number(popupSettings?.generalPrice || 800);
    const studentPrice = Number(popupSettings?.studentPrice || 500);
    return data.priceType === "student" ? studentPrice : generalPrice;
  }
  function getChargedCopies(data) {
    const copies = Number(data?.copies || 1);

    if (isEcommerceOrder(data)) return copies;
    if (data?.salesMode === "free") return 0;
    if (data?.salesMode === "firstFree") {
      if (data.chargedCopies !== undefined && data.chargedCopies !== null && data.chargedCopies !== "") {
        return Math.max(0, Number(data.chargedCopies || 0));
      }
      return Math.max(0, copies - 1);
    }

    return copies;
  }

  function getFreeCopies(data) {
    const copies = Number(data?.copies || 1);
    if (data?.salesMode === "free") return copies;
    if (data?.salesMode === "firstFree") {
      if (data.freeCopies !== undefined && data.freeCopies !== null && data.freeCopies !== "") {
        return Math.max(0, Number(data.freeCopies || 0));
      }
      return Math.min(copies, 1);
    }
    return 0;
  }

  function getTotalPrice(data) {
    if (isEcommerceOrder(data)) {
      if (data.totalPrice !== undefined && data.totalPrice !== null && data.totalPrice !== "") return Number(data.totalPrice || 0);
      return Number(data.productTotal || 0);
    }

    if (data?.salesMode === "free") return 0;

    if (data?.salesMode === "firstFree") {
      return getUnitPrice(data) * getChargedCopies(data);
    }

    if (data.totalPrice !== undefined && data.totalPrice !== null && data.totalPrice !== "") return Number(data.totalPrice || 0);
    return getUnitPrice(data) * Number(data.copies || 1);
  }
  function getDisplayCode(data) {
    if (data.displayCode) return String(data.displayCode);
    const dayKey = String(data.dayKey || "");
    const displayNo = data.displayNo || Number(data.shortId || 0) || "";
    if (dayKey.length >= 6 && displayNo) {
      const code = data.shopCode || popupSettings?.shopCode || "";
      return `${code}${dayKey.slice(2)}${Number(displayNo)}`;
    }
    return displayNo ? String(displayNo) : "";
  }

  function buildShippingGroupsFromOrders(list) {
    const groups = new Map();

    list.forEach(item => {
      const data = item.data || {};
      if (!isEcommerceOrder(data)) return;

      const key = getShippingGroupKey(data);
      if (!key) return;

      if (!groups.has(key)) {
        groups.set(key, {
          key,
          orders: [],
          customerName: data.customerName || "",
          customerPhone: data.customerPhone || "",
          normalizedPhone: data.normalizedPhone || "",
          customerAddress: data.customerAddress || "",
          latestTime: 0
        });
      }

      const group = groups.get(key);
      group.orders.push(item);
      if (!group.customerName && data.customerName) group.customerName = data.customerName;
      if (!group.customerPhone && data.customerPhone) group.customerPhone = data.customerPhone;
      if (!group.normalizedPhone && data.normalizedPhone) group.normalizedPhone = data.normalizedPhone;
      if (!group.customerAddress && data.customerAddress) group.customerAddress = data.customerAddress;
      const t = data.createdAt?.toMillis ? data.createdAt.toMillis() : 0;
      group.latestTime = Math.max(group.latestTime, t);
    });

    return Array.from(groups.values()).map(group => {
      const stat = getShippingGroupStats(group.orders[0]?.data || { shippingGroupId: group.key });
      group.stat = stat;
      group.orders.sort((a, b) => {
        const at = a.data.createdAt?.toMillis ? a.data.createdAt.toMillis() : 0;
        const bt = b.data.createdAt?.toMillis ? b.data.createdAt.toMillis() : 0;
        return at - bt;
      });
      return group;
    }).sort((a, b) => b.latestTime - a.latestTime);
  }

  function startWatch() {
    const q = query(
      collection(db, "orders"),
      where("shopId", "==", shopId)
    );

    onSnapshot(q, snapshot => {
      orders = snapshot.docs.map(docSnap => ({ id: docSnap.id, data: docSnap.data() }));
      orders.sort((a, b) => {
        const aTime = a.data.createdAt?.toMillis ? a.data.createdAt.toMillis() : 0;
        const bTime = b.data.createdAt?.toMillis ? b.data.createdAt.toMillis() : 0;
        return bTime - aTime;
      });
      shippingGroupStats = buildShippingGroupStats(orders);
      renderOrders();
    }, error => {
      console.error(error);
      document.getElementById("orders").innerHTML = `<div class="empty">注文一覧の読み込みに失敗しました。</div>`;
    });
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderOrders();
    });
  });

  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view || "GROUP";
      renderOrders();
    });
  });

  function normalizeSearchCode(value) {
    return String(value || "").toUpperCase().replace(/[^A-Z0-9-]/g, "");
  }

  function runSearch() {
    const input = document.getElementById("searchCodeInput");
    searchCode = normalizeSearchCode(input.value);
    input.value = searchCode;
    renderOrders();
  }

  document.getElementById("searchCodeInput").addEventListener("input", (e) => {
    e.target.value = normalizeSearchCode(e.target.value);
  });
  document.getElementById("searchCodeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });
  document.getElementById("searchBtn").addEventListener("click", runSearch);
  document.getElementById("csvExportBtn").addEventListener("click", exportOrdersCsv);
  document.getElementById("labelPrintBtn").addEventListener("click", printDeliveryLabels);

  await loadSettings();
  setupPinGate();
</script>
</body>
</html>
